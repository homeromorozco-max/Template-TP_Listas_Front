<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header class="filtros">
      <input type="search" id="buscaca" placeholder="Buscar">

      <select name="filtroCategoria" id="filtroCategoria">
        <option value="">Todas las categorias</option>
        <option value="Parrilla">Parrilla</option>
        <option value="Horno">Horno</option>
        <option value="Guiso">Guiso</option>
          <option value="Frito">Frito</option>
    </select>

      <select name="filtroProvincia" id="filtroProvincia">
        <option value="">Todas las provincias</option>
        <option value="Buenos Aires">Buenos Aires</option>
        <option value="Córdoba">Córdoba</option>
        <option value="Santa Fe">Santa Fe</option>
          <option value="Mendoza">Mendoza</option>
    </select>
    </select>



    </header>

    <main class="comida-container" id="comidaContainer">
        
    </main>     
   <section class="addFood">
      <form id="addFoodForm">
        <input type="text" id="foodName" placeholder="Nombre de la comida" required>
        <input type="text" id="foodDescription" placeholder="Descripción de la comida" required>
        <input type="text" id="foodProvince" placeholder="Provincia" required>
        <input type="text" id="foodIngredients" placeholder="Ingredientes (separados por comas)" required>
        <button type="submit">Agregar Comida</button>
      </form>
    </section>
   

    <script type="module" src="./main.js"></script>
</body>
</html>
