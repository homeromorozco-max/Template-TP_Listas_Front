<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
      <!-- Para filtros y navegacion -->
    </header>

    <main class="comida-container" id="comidaContainer">
        
    </main>     
   <section class="addFood">
      <form id="addFoodForm">
        <input type="text" id="foodName" placeholder="Nombre de la comida" required>
        <input type="text" id="foodDescription" placeholder="Descripción de la comida" required>
        <input type="text" id="foodprovince" placeholder="Provincia" required>
        <input type="text" id="foodIngredients" placeholder="Ingredientes (separados por comas)" required>
        <button type="submit">Agregar Comida</button>
      </form>
    </section>
   

    <script type="module" src="./main.js"></script>
</body>
</html>
